version: 2
updates:
  # 补丁版本合成一个 PR；0.x 的次版本在 Cargo 里可能不兼容，仍单独提。
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # 2.5.1 之后改用 auto-launch 0.6，默认先写 HKLM，且插件没有暴露改成仅当前用户的选项。
      - dependency-name: tauri-plugin-autostart
    groups:
      cargo-patch:
        update-types: [patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
