name: 发布

# 推送 v* 标签即发布：标签须与 src-tauri/Cargo.toml 的版本一致（v0.1.0 ↔ 0.1.0）。
# Windows 与 Mac 独立检查构建；Windows 先发布，Mac 成功后追加到同一 Release。带 - 的版本标为预发布。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: 核对标签与版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 读取并核对版本
        id: version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml","rb"))["package"]["version"])')
          tag="${GITHUB_REF_NAME}"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::标签 ${tag} 与 Cargo.toml 的版本 ${version} 不一致"
            exit 1
          fi
          if [[ "${version}" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      # 每个版本必须有 release-notes/<版本>.md，缺了就在这里失败，不进入构建。
      - name: 核对更新说明
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tools/release-notes.mjs check --version "$VERSION"

  ci:
    name: 检查与构建
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    with:
      windows_only: true

  macos:
    name: macOS 检查与构建
    needs: verify-tag
    uses: ./.github/workflows/macos.yml
    with:
      # 正式发布必须用固定自签名证书签名；缺少 secret 时构建失败。
      release_sign: true
    secrets: inherit

  publish:
    name: 创建 GitHub Release
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码（读取更新说明与生成脚本）
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: nianlai-windows
          path: dist-release
      - name: 核对产物
        shell: bash
        working-directory: dist-release
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          zip="nianlai-${VERSION}-windows-x64-portable.zip"
          sum="nianlai-${VERSION}.sha256"
          test -f "$zip" && test -f "$sum" && test -f build-info.json
          # 校验文件由 PowerShell 写出，带 BOM 和 CRLF。
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' "$sum" | sha256sum -c -
          python3 - <<'EOF'
          import json, os
          info = json.load(open("build-info.json", encoding="utf-8-sig"))
          problems = []
          if info.get("version") != os.environ["VERSION"]:
              problems.append(f"版本 {info.get('version')} 与标签不符")
          if info.get("source_commit") != os.environ["GITHUB_SHA"]:
              problems.append(f"source_commit {info.get('source_commit')} 不是标签提交 {os.environ['GITHUB_SHA']}")
          if info.get("git_dirty") or info.get("skip_build"):
              problems.append("构建时工作区有改动或跳过了构建")
          if problems:
              raise SystemExit("产物核对失败：" + "；".join(problems))
          print("产物核对通过：", info["version"], info["exe_sha256"])
          EOF
      - name: 创建 Release
        shell: bash
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          zip="nianlai-${VERSION}-windows-x64-portable.zip"
          sum="nianlai-${VERSION}.sha256"
          exe_sha=$(python3 -c 'import json; print(json.load(open("build-info.json", encoding="utf-8-sig"))["exe_sha256"])')
          zip_sha=$(sha256sum "$zip" | cut -d' ' -f1)
          {
            echo "Windows x64 便携版：解压后运行 \`nianlai.exe\`，需要 WebView2 运行时（Windows 11 通常自带）。"
            echo "此版本未签名，SmartScreen 提示时选择“更多信息 → 仍要运行”。"
            echo
            if [ "$PRERELEASE" = true ]; then echo; echo "这是预发布版本，仍在自用验证阶段。"; fi
            echo
            echo "| 文件 | SHA-256 |"
            echo "|---|---|"
            echo "| \`${zip}\` | \`${zip_sha}\` |"
            echo "| \`nianlai.exe\` | \`${exe_sha}\` |"
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # 重跑幂等：Release 已存在就不再创建，资产逐个核对或补传（与 macOS 任务一致）。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > assets.txt
            for asset in "$zip" "$sum" build-info.json; do
              if grep -Fxq "$asset" assets.txt; then
                mkdir -p existing
                gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir existing --clobber
                cmp "$asset" "existing/$asset"
              else
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" "$zip" "$sum" build-info.json \
              --verify-tag --title "拈来 ${VERSION}" --notes-file notes.md --generate-notes "${flags[@]}"
          fi
      # 版本文件最后上传：客户端读到它时，Windows 安装包一定已经在 Release 里。
      - name: 生成并上传 latest-windows.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          node tools/release-notes.mjs feed --platform windows --version "$VERSION" \
            --file "dist-release/nianlai-${VERSION}-windows-x64-portable.zip" --out latest-windows.json
          # 版本文件内容由安装包和更新说明决定，重跑时直接覆盖。
          gh release upload "$GITHUB_REF_NAME" latest-windows.json --clobber

  publish-macos:
    name: 为同一 Release 添加 macOS 安装包
    needs: [verify-tag, macos, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码（读取更新说明与生成脚本）
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 下载 macOS 安装包
        uses: actions/download-artifact@v8
        with:
          name: nianlai-macos
          path: dist-macos
      - name: 核对并追加 Mac 产物和说明
        shell: bash
        working-directory: dist-macos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          dmg="nianlai-${VERSION}-macos-universal.dmg"
          test -f "$dmg" && test -f "$dmg.sha256"
          sha256sum -c "$dmg.sha256"
          # 重跑只复用字节一致的附件；不覆盖已发布资产。
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > assets.txt
          for asset in "$dmg" "$dmg.sha256"; do
            if grep -Fxq "$asset" assets.txt; then
              mkdir -p existing
              gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir existing
              cmp "$asset" "existing/$asset"
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done
          # 附件成功后才追加 Mac 下载说明，保留 Windows 和 GitHub 自动生成的说明。
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > notes.md
          if ! grep -Fq '<!-- nianlai-macos-assets -->' notes.md; then
            dmg_sha=$(sha256sum "$dmg" | cut -d' ' -f1)
            {
              echo
              echo '<!-- nianlai-macos-assets -->'
              echo '### macOS（Beta）'
              echo
              echo '支持 macOS 13 及更新版本，通用安装包包含 Apple Silicon 与 Intel。打开 DMG 后把 Nianlai 拖入“应用程序”，再打开和启用开机启动。'
              echo 'Beta 使用固定的自签名证书签名，未做 Developer ID 签名或公证。首次打开若被拦截，在“系统设置 › 隐私与安全性”选择“仍要打开”；在“辅助功能”里允许拈来，即可直接粘贴。更新后可能需要重新授权。'
              echo 'Beta 不含手动逐张粘贴、原生编辑控件直投、Windows 内存采样与 WebView2 挂起，以及正式签名与公证；已选内容的一起粘贴仍可用。'
              echo
              echo '| 文件 | SHA-256 |'
              echo '|---|---|'
              echo "| \`${dmg}\` | \`${dmg_sha}\` |"
            } >> notes.md
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi
      # DMG 上传完成后最后上传版本文件，客户端读到它时安装包一定已经就位。
      - name: 生成并上传 latest-macos.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          node tools/release-notes.mjs feed --platform macos --version "$VERSION" \
            --file "dist-macos/nianlai-${VERSION}-macos-universal.dmg" --out latest-macos.json
          gh release upload "$GITHUB_REF_NAME" latest-macos.json --clobber
