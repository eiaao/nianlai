name: 发布

# 推送 v* 标签即发布：标签须与 src-tauri/Cargo.toml 的版本一致（v0.1.0 ↔ 0.1.0）。
# 先跑完整的检查与构建，再核对产物并创建 GitHub Release；带 - 的版本标为预发布。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: 核对标签与版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 读取并核对版本
        id: version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml","rb"))["package"]["version"])')
          tag="${GITHUB_REF_NAME}"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::标签 ${tag} 与 Cargo.toml 的版本 ${version} 不一致"
            exit 1
          fi
          if [[ "${version}" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  ci:
    name: 检查与构建
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  macos:
    name: 构建 macOS universal 安装包
    needs: [verify-tag, ci]
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装 Rust 工具链与双架构目标
        run: |
          rustup toolchain install
          rustc -V
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
          cache-on-failure: true
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 构建 macOS universal
        run: pnpm tauri build --target universal-apple-darwin
      - name: 核对安装包并生成校验值
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml","rb"))["package"]["version"])')
          bundle="${CARGO_TARGET_DIR}/universal-apple-darwin/release/bundle"
          shopt -s nullglob
          apps=("$bundle/macos/"*.app)
          images=("$bundle/dmg/"*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#images[@]}" -eq 1
          app="${apps[0]}"
          plist="$app/Contents/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          test "$app_version" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Nianlai"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "13.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = "true"
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          hdiutil verify "${images[0]}"
          mkdir -p release
          name="nianlai-${version}-macos-universal.dmg"
          cp "${images[0]}" "release/$name"
          (cd release && shasum -a 256 "$name" > "$name.sha256")
      - name: 上传 macOS 安装包与校验值
        uses: actions/upload-artifact@v7
        with:
          name: nianlai-macos
          path: |
            release/nianlai-*-macos-universal.dmg
            release/nianlai-*-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 创建 GitHub Release
    needs: [verify-tag, ci, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: nianlai-windows
          path: dist-release
      - name: 下载 macOS 安装包
        uses: actions/download-artifact@v8
        with:
          name: nianlai-macos
          path: dist-release
      - name: 核对产物
        shell: bash
        working-directory: dist-release
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          zip="nianlai-${VERSION}-windows-x64-portable.zip"
          sum="nianlai-${VERSION}.sha256"
          test -f "$zip" && test -f "$sum" && test -f build-info.json
          # 校验文件由 PowerShell 写出，带 BOM 和 CRLF。
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' "$sum" | sha256sum -c -
          python3 - <<'EOF'
          import json, os
          info = json.load(open("build-info.json", encoding="utf-8-sig"))
          problems = []
          if info.get("version") != os.environ["VERSION"]:
              problems.append(f"版本 {info.get('version')} 与标签不符")
          if info.get("source_commit") != os.environ["GITHUB_SHA"]:
              problems.append(f"source_commit {info.get('source_commit')} 不是标签提交 {os.environ['GITHUB_SHA']}")
          if info.get("git_dirty") or info.get("skip_build"):
              problems.append("构建时工作区有改动或跳过了构建")
          if problems:
              raise SystemExit("产物核对失败：" + "；".join(problems))
          print("产物核对通过：", info["version"], info["exe_sha256"])
          EOF
          dmg="nianlai-${VERSION}-macos-universal.dmg"
          test -f "$dmg"
          test -f "$dmg.sha256"
          sha256sum -c "$dmg.sha256"
      - name: 创建 Release
        shell: bash
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          zip="nianlai-${VERSION}-windows-x64-portable.zip"
          sum="nianlai-${VERSION}.sha256"
          exe_sha=$(python3 -c 'import json; print(json.load(open("build-info.json", encoding="utf-8-sig"))["exe_sha256"])')
          zip_sha=$(sha256sum "$zip" | cut -d' ' -f1)
          dmg="nianlai-${VERSION}-macos-universal.dmg"
          dmg_sha=$(sha256sum "$dmg" | cut -d' ' -f1)
          {
            echo "Windows x64 便携版：解压后运行 \`nianlai.exe\`，需要 WebView2 运行时（Windows 11 通常自带）。"
            echo "此版本未签名，SmartScreen 提示时选择“更多信息 → 仍要运行”。"
            echo
            echo "macOS（Beta）：支持 macOS 13 及更新版本，通用安装包同时包含 Apple Silicon 与 Intel。打开 DMG 后把 Nianlai 拖入“应用程序”，再打开和启用开机启动。"
            echo "Beta 仅使用 ad-hoc 签名，未做 Developer ID 签名或公证。首次打开若被拦截，在“系统设置 › 隐私与安全性”选择“仍要打开”；在“辅助功能”里允许拈来，即可直接粘贴。更新后可能需要重新授权。"
            echo "Beta 不含手动逐张粘贴、原生编辑控件直投、Windows 内存采样与 WebView2 挂起，以及正式签名与公证；已选内容的一起粘贴仍可用。"
            if [ "$PRERELEASE" = true ]; then echo; echo "这是预发布版本，仍在自用验证阶段。"; fi
            echo
            echo "| 文件 | SHA-256 |"
            echo "|---|---|"
            echo "| \`${zip}\` | \`${zip_sha}\` |"
            echo "| \`nianlai.exe\` | \`${exe_sha}\` |"
            echo "| \`${dmg}\` | \`${dmg_sha}\` |"
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$zip" "$sum" build-info.json "$dmg" "$dmg.sha256" \
            --verify-tag --title "拈来 ${VERSION}" --notes-file notes.md --generate-notes "${flags[@]}"
