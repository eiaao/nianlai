name: Windows 与 macOS 检查构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 发布工作流复用整套检查和构建，产物由调用方取用。
  workflow_call:

permissions:
  contents: read

concurrency:
  # 同一 PR 的旧运行直接取消；main 的每次推送都保留完整结果。
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  check:
    name: 检查
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: 安装 Node.js 并缓存 pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # 版本和组件以 rust-toolchain.toml 为准，本机与 CI 一致。
      - name: 安装 Rust 工具链
        run: rustup toolchain install && rustc -V
      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 检查前端
        run: pnpm check
      - name: 面板状态机回归
        run: node tools/test-panel-key-repeat.mjs
      - name: 平台键名映射回归
        run: node tools/test-platform.mjs
      # Windows runner 的控制台编码是 cp1252，-X utf8 才能输出中文；-I 会忽略 PYTHONUTF8 环境变量。
      - name: 核对发布版本来源
        run: python -X utf8 -I tools/check_release_versions.py
      - name: 核对 PowerShell 脚本编码
        run: python -X utf8 -I tools/check_ps1_encoding.py
      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check
      - name: 检查 Rust 代码
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 运行 Rust 测试
        run: cargo test --workspace
      - name: 伪密码管理器测试（改写剪贴板，单独跑）
        run: cargo test -p nianlai fake_password_manager -- --ignored
      - name: 检查发布脚本
        run: python -X utf8 -I -m unittest discover -s tools -p "test_release*.py" -v

  macos-build:
    name: 构建 macOS universal 安装包
    needs: macos
    # 标签由 release.yml 的 macos job 打包，避免同一次发布重复构建。
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装 Rust 工具链与双架构目标
        run: |
          rustup toolchain install
          rustc -V
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
          cache-on-failure: true
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 构建 macOS universal
        run: pnpm tauri build --target universal-apple-darwin
      - name: 核对安装包并生成校验值
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml","rb"))["package"]["version"])')
          bundle="${CARGO_TARGET_DIR}/universal-apple-darwin/release/bundle"
          shopt -s nullglob
          apps=("$bundle/macos/"*.app)
          images=("$bundle/dmg/"*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#images[@]}" -eq 1
          app="${apps[0]}"
          plist="$app/Contents/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          test "$app_version" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Nianlai"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "13.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = "true"
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          hdiutil verify "${images[0]}"
          mkdir -p release
          name="nianlai-${version}-macos-universal.dmg"
          cp "${images[0]}" "release/$name"
          (cd release && shasum -a 256 "$name" > "$name.sha256")
      - name: 上传 macOS 安装包与校验值
        uses: actions/upload-artifact@v7
        with:
          name: nianlai-macos
          path: |
            release/nianlai-*-macos-universal.dmg
            release/nianlai-*-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  build:
    name: 构建便携版
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: 安装 Node.js 并缓存 pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # 版本和组件以 rust-toolchain.toml 为准，本机与 CI 一致。
      - name: 安装 Rust 工具链
        run: rustup toolchain install && rustc -V
      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: 构建 Windows x64 便携版
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release.ps1
      - name: 上传便携版与构建信息
        uses: actions/upload-artifact@v7
        with:
          name: nianlai-windows
          path: |
            release/nianlai-*-windows-x64-portable.zip
            release/nianlai-*.sha256
            release/build-info.json
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS 检查
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装 Rust 工具链
        run: rustup toolchain install && rustc -V
      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-check
          cache-on-failure: true
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 检查前端
        run: pnpm check
      - name: 面板状态机回归
        run: node tools/test-panel-key-repeat.mjs
      - name: 平台键名映射回归
        run: node tools/test-platform.mjs
      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check
      - name: 检查 Rust 代码
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 运行 Rust 测试
        run: cargo test --workspace
