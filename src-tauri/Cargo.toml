[package]
name = "nianlai"
version = "0.1.2"
description = "拈来：开源剪贴板工具"
authors = ["Nianlai contributors"]
license = "MIT"
repository = "https://github.com/eiaao/nianlai"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nianlai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
nianlai-store = { path = "../crates/nianlai-store" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 新版本检测与原地更新：版本比较、sha256、便携版 zip 校验解压（均为纯 Rust，不引入 TLS 或 OpenSSL）。
semver = "1"
sha2 = "0.11.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri = { version = "2.12.5", features = [
  "image-png", "tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.5.4"
# 此版本使用仅写 HKCU 的 auto-launch 0.5；2.7.0 起改用 auto-launch 0.6，默认先写 HKLM（以管理员运行时生效），所以固定版本，dependabot 也已忽略。
tauri-plugin-autostart = "=2.5.1"

# 版本要和 Tauri 内部的 wry 对齐（wry 0.57 用 webview2-com 0.39、windows 0.62），
# 否则从 with_webview 拿到的 WebView2 接口类型对不上。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  # 新版本系统通知（Toast）
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
] }

# 与 Tauri / tao 的 objc2 系列保持一致。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXValue", "AXError", "libc", "objc2"] }
core-graphics = "0.25"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "3ffa93ed14e0f8e857e43619b4157f2a685d35a4" }
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
rfd = "0.17.2"
libc = "0.2"
