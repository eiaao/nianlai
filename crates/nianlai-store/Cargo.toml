[package]
name = "nianlai-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
